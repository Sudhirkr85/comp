<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark & Metallic Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="80%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Curved Text Paths -->
    <!-- Top Arc (Clockwise) -->
    <path id="topTextArc" d="M 75,250 A 175,175 0 1,1 425,250" fill="none" />
    <!-- Bottom Arc (Clockwise for easy reading) -->
    <path id="bottomTextArc" d="M 425,250 A 175,175 0 0,1 75,250" fill="none" />
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Gradient Glow -->
  <circle cx="250" cy="250" r="236" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="8" filter="url(#glow)"/>
  <circle cx="250" cy="250" r="236" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="8"/>
  <circle cx="250" cy="250" r="224" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Inner Center Plate -->
  <circle cx="250" cy="250" r="140" fill="#030712" stroke="url(#ringGrad)" stroke-width="3.5"/>
  <circle cx="250" cy="250" r="132" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-dasharray="4 6" stroke-width="1.5"/>

  <!-- Top Arc Text: SA SOFTWARE INNOVATION -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#ffffff" letter-spacing="4.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      SA SOFTWARE INNOVATION
    </textPath>
  </text>

  <!-- Separator Dots -->
  <circle cx="68" cy="250" r="4.5" fill="#38bdf8"/>
  <circle cx="432" cy="250" r="4.5" fill="#38bdf8"/>

  <!-- Bottom Arc Text: STRIVE AND ACHIEVE -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#38bdf8" letter-spacing="6">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      STRIVE AND ACHIEVE
    </textPath>
  </text>

  <!-- CENTER MONOGRAM: Modern Geometric S & A Intertwined -->
  <g transform="translate(250, 250)">
    <!-- Tech Background Node Lines -->
    <path d="M -70,-30 L -40,-30 L 0,-60 L 40,-30 L 70,-30" stroke="rgba(255,255,255,0.08)" stroke-width="2" fill="none"/>
    <path d="M -70,30 L -30,60 L 30,60 L 70,30" stroke="rgba(255,255,255,0.08)" stroke-width="2" fill="none"/>
    <circle cx="0" cy="-60" r="3" fill="#38bdf8" opacity="0.6"/>
    <circle cx="0" cy="60" r="3" fill="#6366f1" opacity="0.6"/>

    <!-- Letter A Backbone (Right & Center) -->
    <polygon points="5,-55 35,-55 75,55 45,55 35,25 -5,25 5,-55" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.3"/>
    
    <!-- Letter S (Dynamic Cyber Silver) -->
    <path d="M 20,-48 C 5,-56 -35,-56 -45,-30 C -52,-10 -30,2 -5,12 C 25,22 35,35 28,52 C 18,68 -22,68 -48,56 L -42,36 C -20,46 10,48 14,35 C 18,22 -2,12 -25,2 C -50,-10 -42,-38 -25,-52 C -5,-62 30,-60 40,-48 Z" 
          fill="url(#silverGrad)"/>

    <!-- Letter A (Electric Cyan Overlap) -->
    <path d="M 12,-55 L 36,-55 L 68,52 L 44,52 L 36,25 L 8,25 L 1,4 L 30,4 L 24,-24 L 12,-55 Z" 
          fill="url(#blueGlow)"/>

    <!-- Inner A Crossbar Core Accent -->
    <polygon points="20,-15 28,6 12,6" fill="#030712"/>

    <!-- Spark Dot in Monogram -->
    <circle cx="48" cy="-35" r="4" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="48" cy="-35" r="2.5" fill="#38bdf8"/>
  </g>
</svg>
